name: Build News Dashboard

on:
  schedule:
    # 한국 장중(09:00-15:30 KST = 00:00-06:30 UTC) 10분마다, 그 외 시간 1시간마다
    - cron: '*/5 0-6 * * 1-5'    # 한국 장중 (월~금)
    - cron: '*/15 * * * *'          # 그 외 시간 1시간마다
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install feedparser
      - name: Build site
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}  # 옵션: Settings > Secrets에 등록
        run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
